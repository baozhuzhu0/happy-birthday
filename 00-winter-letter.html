<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00 · 冬夜来信 · 立冬来信</title>
<style>
  :root{
    --sky1:#0C142B; --sky2:#101A38; --sky3:#142245; --sky4:#1A2B52; --sky5:#22345C;
    --snow:#D8E4F3;
    --warm:#F6C85F;
    --paper:#F7F0DE;
    --edge:#2E2016;
    --ink:#3B2A1C;
    --seal:#A83A2C;
    --pixel-font:"Fusion Pixel","Zpix","DotGothic16","Sarasa Mono SC","Microsoft YaHei",monospace;
    --en-font:"Silkscreen","DotGothic16",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#050810;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

  #stage{
    position:relative;flex:0 0 auto;
    width:1440px;height:900px;
    background:var(--sky1);
    overflow:hidden;
    transform-origin:center center;
    font-family:var(--pixel-font);
    -webkit-font-smoothing:none;
  }

  /* ---------- 场景 ---------- */
  #scene{position:absolute;left:0;top:0;z-index:0}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
  .tw1{animation:twinkle 3.4s ease-in-out infinite}
  .tw2{animation:twinkle 4.6s ease-in-out 1.2s infinite}
  .tw3{animation:twinkle 2.9s ease-in-out .7s infinite}
  @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
  .win{animation:breathe 4.2s ease-in-out infinite}

  /* ---------- 雪花 ---------- */
  #snow{position:absolute;left:0;top:0;width:1440px;height:900px;z-index:1;pointer-events:none}
  .flake{position:absolute;left:0;top:0;background:#FBF6E4;will-change:transform}
  .flake.blue{background:#C9D7F0}

  /* ---------- 入场文字 ---------- */
  .fade{opacity:0;transform:translateY(10px);transition:opacity 900ms ease,transform 900ms ease}
  .fade.show{opacity:1;transform:translateY(0)}

  #eng{
    position:absolute;left:0;top:108px;width:1440px;text-align:center;z-index:3;
    font-family:var(--en-font);
    font-size:16px;letter-spacing:8px;color:#8FA6C9;
  }
  #title{
    position:absolute;left:0;top:142px;width:1440px;text-align:center;z-index:3;
    font-size:96px;letter-spacing:16px;color:#FBF3DF;
    text-shadow:10px 10px 0 rgba(3,5,12,.9);
  }
  #plank{
    position:absolute;left:452px;top:292px;width:536px;height:64px;z-index:3;
    background:#E3C08A;border:8px solid #6B4A2E;
    display:flex;align-items:center;justify-content:center;
    color:#4A3220;font-size:24px;letter-spacing:4px;
  }

  /* ---------- 信封 ---------- */
  #envGlow{
    position:absolute;left:340px;top:340px;width:760px;height:470px;z-index:2;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse,rgba(246,200,95,.17) 0%,rgba(246,200,95,.05) 48%,rgba(246,200,95,0) 74%);
    transition:transform 700ms ease,opacity 700ms ease;
  }
  #envGlow.lit{transform:scale(1.12);opacity:1}
  #envShadow{
    position:absolute;left:496px;top:706px;width:448px;height:24px;z-index:3;
    background:#ADC1D8;opacity:.55;
  }
  #env{
    position:absolute;left:480px;top:404px;width:480px;height:300px;z-index:4;
    cursor:pointer;perspective:900px;
    transition:transform 400ms ease;
  }
  #env:hover{transform:translateY(-8px)}
  #env.opened{cursor:default}
  #env.opened:hover{transform:none}
  #envBody{position:absolute;left:0;top:0;width:480px;height:300px}
  #flap{
    position:absolute;left:0;top:0;width:480px;height:232px;
    transform-origin:50% 0%;
    transition:transform 900ms cubic-bezier(.3,.7,.3,1),opacity 900ms ease;
    will-change:transform;
  }
  /* 翻上去的封口同步淡到很浅，避免扫过标题区 */
  #flap.open{transform:rotateX(160deg);opacity:.15}
  #seal{
    position:absolute;left:204px;top:196px;width:72px;height:72px;z-index:5;
    transition:opacity 350ms ease,transform 350ms ease;
  }
  #seal.gone{opacity:0;transform:scale(1.5) rotate(18deg)}

  /* ---------- 拆信后 ---------- */
  #letterOut{
    position:absolute;left:520px;top:470px;width:400px;height:270px;z-index:9;
    background:var(--paper);border:8px solid var(--edge);
    box-shadow:0 18px 0 rgba(0,0,0,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;clip-path:inset(100% 0 0 0);
    transition:clip-path 900ms ease,transform 1100ms cubic-bezier(.2,.8,.2,1),opacity 400ms ease;
  }
  #letterOut.show{opacity:1;clip-path:inset(0 0 0 0);transform:translateY(-180px)}
  #letterOut .l1{font-size:26px;letter-spacing:4px;color:var(--ink)}
  #letterOut .l2{margin-top:22px;font-size:14px;letter-spacing:3px;color:#8A5C35}
  #letterOut .l3{margin-top:34px;font-size:12px;letter-spacing:2px;color:#A89070}

  #veil{
    position:absolute;inset:0;z-index:8;background:#050810;opacity:0;
    pointer-events:none;transition:opacity 900ms ease;
  }
  #veil.show{opacity:.66}
  #after{
    position:absolute;left:0;top:730px;width:1440px;text-align:center;z-index:10;
    font-size:16px;letter-spacing:3px;color:#F6C85F;
    opacity:0;transition:opacity 900ms ease;pointer-events:none;
  }
  #after.show{opacity:1}

  /* ---------- 底部与控件 ---------- */
  #hint{
    position:absolute;left:0;top:776px;width:1440px;text-align:center;z-index:3;
    font-size:24px;letter-spacing:4px;color:#3B2A1C;
  }
  #hint.hide{opacity:0;transition:opacity 400ms ease}
  /* 背景音乐由整站外壳 index.html 统一播放，封面不再自带占位合成音 */
  #replay{
    position:absolute;right:16px;top:14px;z-index:20;
    font-family:inherit;font-size:12px;letter-spacing:.1em;
    color:#42536E;background:none;border:none;cursor:pointer;
    opacity:.55;transition:opacity .3s,color .3s;
  }
  #replay:hover{opacity:1;color:#8FA6C9}
</style>

<script>
(function(){
  var stage = document.getElementById('stage');
  var env   = document.getElementById('env');
  var flap  = document.getElementById('flap');
  var seal  = document.getElementById('seal');
  var glow  = document.getElementById('envGlow');
  var veil  = document.getElementById('veil');
  var letterOut = document.getElementById('letterOut');
  var after = document.getElementById('after');
  var hint  = document.getElementById('hint');
  var replay= document.getElementById('replay');
  var fades = Array.prototype.slice.call(document.querySelectorAll('.fade'));

  /* ---------- 等比缩放 ---------- */
  function fit(){
    var s = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- 雪花：缓慢飘落 + 轻微横向摆动 ---------- */
  var snowLayer = document.getElementById('snow');
  var flakes = [];
  var SIZES = [4,4,6,6,8];
  for (var i = 0; i < 48; i++){
    var d = document.createElement('div');
    d.className = 'flake' + (i % 3 === 0 ? ' blue' : '');
    var sz = SIZES[i % SIZES.length];
    d.style.width = sz + 'px';
    d.style.height = sz + 'px';
    d.style.opacity = (0.24 + (i % 4) * 0.14).toFixed(2);
    snowLayer.appendChild(d);
    flakes.push({
      el: d,
      x: Math.random() * 1440,
      y: Math.random() * 900,
      vy: 11 + Math.random() * 22,
      amp: 8 + Math.random() * 22,
      phase: Math.random() * Math.PI * 2
    });
  }
  var last = performance.now();
  function tick(now){
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    for (var k = 0; k < flakes.length; k++){
      var f = flakes[k];
      f.y += f.vy * dt;
      f.phase += dt * 0.55;
      if (f.y > 908){ f.y = -8; f.x = Math.random() * 1440; }
      var xx = f.x + Math.sin(f.phase) * f.amp;
      f.el.style.transform = 'translate3d(' + xx.toFixed(1) + 'px,' + f.y.toFixed(1) + 'px,0)';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* 背景音乐由整站外壳 index.html 播放，跨章节不中断；本页不再创建 AudioContext */

  /* ---------- 入场与拆信 ---------- */
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  var running = false;
  var opened = false;

  function reset(){
    fades.forEach(function(el){ el.classList.remove('show'); });
    flap.classList.remove('open');
    seal.classList.remove('gone');
    glow.classList.remove('lit');
    veil.classList.remove('show');
    letterOut.classList.remove('show');
    after.classList.remove('show');
    hint.classList.remove('hide');
    env.classList.remove('opened');
    opened = false;
  }

  async function run(){
    if (running) return;
    running = true;
    reset();
    await sleep(260);
    fades[0].classList.add('show');       // 英文题
    await sleep(340);
    fades[1].classList.add('show');       // 主标题
    await sleep(420);
    fades[2].classList.add('show');       // 木牌副标题
    await sleep(500);
    glow.classList.add('lit');
    running = false;
  }

  async function openLetter(){
    if (opened || running) return;
    opened = true;
    env.classList.add('opened');
    hint.classList.add('hide');
    fades.forEach(function(el){ el.classList.remove('show'); });  // 封面文字退场

    seal.classList.add('gone');           // 火漆印化开
    await sleep(360);
    flap.classList.add('open');           // 封口向上翻开
    await sleep(420);
    letterOut.classList.add('show');      // 信纸从信封里升起
    await sleep(900);
    veil.classList.add('show');           // 夜色压暗，只留信纸
    await sleep(500);
    after.classList.add('show');
  }

  env.addEventListener('click', function(e){ e.stopPropagation(); openLetter(); });

  stage.addEventListener('click', function(){
    if (opened && after.classList.contains('show')){
      window.location.href = '01-opening-letter.html';
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      if (!opened) openLetter();
      else if (after.classList.contains('show')) window.location.href = '01-opening-letter.html';
    }
  });

  replay.addEventListener('click', function(e){
    e.stopPropagation();
    if (!running) run();
  });

  run();
})();
</script>
</body>
</html>
