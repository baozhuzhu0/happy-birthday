<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 · 高中记忆地图 · 立冬来信</title>
<style>
  :root{
    --night:#0C142B;
    --grass:#22332A;
    --road:#3A3E4C;
    --dirt:#6E5D45;
    --wall:#6B4230;
    --snow:#C9D6E6;
    --warm:#F6C85F;
    --warm-lt:#FFF3C9;
    --paper:#F7F0DE;
    --edge:#2E2016;
    --ink:#3B2A1C;
    --seal:#A83A2C;
    --wood:#E3C08A;
    --wood-edge:#6B4A2E;
    --dim:#6E82A6;
    --pixel-font:"Fusion Pixel","Zpix","DotGothic16","Sarasa Mono SC","Microsoft YaHei",monospace;
    --en-font:"Silkscreen","DotGothic16",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#050810;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

  #stage{
    position:relative;flex:0 0 auto;
    width:1440px;height:900px;
    background:var(--night);
    overflow:hidden;
    transform-origin:center center;
    font-family:var(--pixel-font);
    -webkit-font-smoothing:none;
    user-select:none;
  }

  /* ---------- 地图 ---------- */
  #map{position:absolute;left:0;top:0;z-index:1;transform:translateY(48px);transition:filter 1400ms ease}
  #map.allLit{filter:brightness(1.32) saturate(1.12)}
  #dawn{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:rgba(246,200,95,.09);opacity:0;transition:opacity 1600ms ease;
  }
  #dawn.show{opacity:1}
  .win{fill:#2A3A46}
  .win.pre{fill:#8A6A3A}
  #map.allLit .win{fill:#F6C85F}

  /* 卡片打开时压暗地图，但灯层浮在上层，点亮过程一定看得见 */
  #veil{
    position:absolute;inset:0;z-index:3;background:rgba(5,8,16,.58);
    opacity:0;pointer-events:none;transition:opacity 500ms ease;
  }
  #veil.show{opacity:1;pointer-events:auto}

  /* ---------- 路灯 ---------- */
  #lampLayer{position:absolute;inset:0;z-index:4;pointer-events:none;transform:translateY(48px)}

  /* 顶部 HUD 带：让控件不压在建筑上 */
  #topbar{
    position:absolute;left:0;top:0;width:1440px;height:48px;z-index:5;
    background:#0C142B;border-bottom:2px solid #22345C;
  }
  .spot{position:absolute;width:40px;height:64px;pointer-events:auto;cursor:pointer}
  .spot svg{display:block;width:40px;height:64px;position:relative;z-index:2}
  .bulb{fill:#2A3346;transition:fill 420ms ease}
  .spot:hover .bulb{fill:#5A6780}
  .spot.lit .bulb,.spot.lit:hover .bulb{fill:#F6C85F}
  .pool{
    position:absolute;left:0;top:58px;width:40px;height:8px;z-index:1;
    background:#F6C85F;opacity:0;transition:opacity 700ms ease;
  }
  .spot.lit .pool{opacity:.28}
  /* 硬边方形光晕，不用模糊，保持像素感 */
  .halo{
    position:absolute;left:16px;top:12px;width:8px;height:8px;z-index:0;
    background:transparent;box-shadow:none;
    transition:box-shadow 700ms ease;
  }
  .spot.lit .halo{
    background:#FFF3C9;
    box-shadow:0 0 0 8px rgba(246,200,95,.22),
               0 0 0 20px rgba(246,200,95,.12),
               0 0 0 36px rgba(246,200,95,.06),
               0 0 0 56px rgba(246,200,95,.025);
  }
  .spot.justLit .halo{animation:lampPulse 900ms cubic-bezier(.2,.8,.3,1)}
  @keyframes lampPulse{
    0%{transform:scale(.2);opacity:0}
    45%{transform:scale(1.5);opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  #lampLayer.celebrate .spot.lit .halo{animation:lampPulse 1200ms ease-out}
  @keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}
  .spot.lit svg{animation:breathe 4.2s ease-in-out infinite}

  .hit{
    position:absolute;left:-18px;top:-14px;width:76px;height:92px;z-index:3;
    pointer-events:none;border:2px solid transparent;
    transition:border-color 220ms ease,transform 220ms ease;
  }
  .spot:hover .hit{border-color:rgba(143,166,201,.55)}
  .spot.lit:hover .hit{border-color:rgba(246,200,95,.6)}
  .lbl{
    position:absolute;left:28px;top:34px;z-index:3;
    font-size:13px;letter-spacing:1px;color:#A9BDDC;white-space:nowrap;
    padding:4px 10px;background:rgba(9,16,30,.88);border:2px solid #2A3A52;
    pointer-events:auto;transition:color 500ms ease,border-color 500ms ease;
    text-shadow:2px 2px 0 rgba(3,6,14,.9);
  }
  .lbl b{font-family:var(--en-font);font-weight:normal;margin-right:8px;opacity:.8}
  .spot.lit .lbl{color:var(--warm);border-color:rgba(246,200,95,.6)}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;z-index:6;pointer-events:none}
  #chapter{
    position:absolute;left:48px;top:16px;
    font-family:var(--en-font);font-size:13px;letter-spacing:3px;color:#7E93B4;
  }
  #panel{
    position:absolute;left:48px;top:730px;width:328px;height:72px;
    background:#231A14;border:6px solid var(--wood-edge);
    box-shadow:8px 8px 0 rgba(0,0,0,.35);
    padding:10px 14px;
  }
  #panelTitle{font-size:14px;letter-spacing:2px;color:var(--wood)}
  #dots{display:flex;gap:8px;margin-top:12px}
  .dot{width:20px;height:14px;background:#3A4A5E;border:2px solid #1B2433}
  .dot.lit{background:var(--warm);border-color:#C99A3E}
  .dot.read{box-shadow:0 0 0 2px #FBF3DF}
  #title{
    position:absolute;left:48px;top:810px;
    font-size:34px;letter-spacing:6px;color:#FBF3DF;
    text-shadow:6px 6px 0 rgba(3,5,12,.9);
  }
  #subtitle{
    position:absolute;left:50px;top:858px;
    font-size:12px;letter-spacing:3px;color:#5E7296;
  }
  #tips{
    position:absolute;left:400px;top:744px;
    font-size:12px;letter-spacing:2px;color:#596E90;line-height:26px;
    transition:opacity 600ms ease;
  }
  #tips.hide{opacity:0}

  /* ---------- 顶部控件 ---------- */
  .ctl{
    position:absolute;top:14px;z-index:12;
    font-family:inherit;font-size:12px;letter-spacing:1px;
    color:#8FA6C9;background:none;border:none;cursor:pointer;
    opacity:.72;transition:opacity .3s,color .3s;
  }
  .ctl:hover{opacity:1;color:var(--warm)}
  #back{right:112px}
  #replay{right:24px}

  /* ---------- 记忆卡片 ---------- */
  #card{
    position:absolute;top:100px;width:600px;height:600px;z-index:8;
    background:var(--paper);border:8px solid var(--edge);
    box-shadow:0 18px 0 rgba(0,0,0,.42), 0 0 0 4px rgba(246,200,95,.08);
    display:flex;flex-direction:column;
    opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;
    transition:opacity 360ms ease,transform 420ms cubic-bezier(.2,.8,.3,1),left 320ms ease;
  }
  #card.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  #cardHead{
    flex:0 0 92px;background:#3A2718;border-bottom:6px solid var(--wood-edge);
    display:flex;align-items:center;padding:0 20px;position:relative;
  }
  #cardNo{
    width:48px;height:48px;flex:0 0 48px;background:var(--seal);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--en-font);font-size:20px;color:#FBEFE0;
  }
  #cardTitles{margin-left:18px}
  #cardTitle{font-size:24px;letter-spacing:3px;color:#FBF3DF}
  #cardPlace{margin-top:7px;font-size:12px;letter-spacing:2px;color:#C6A87C}
  #cardClose{
    position:absolute;right:16px;top:16px;width:32px;height:32px;
    background:#5A3C24;border:2px solid #7A5634;color:#F3DFC0;
    font-family:var(--en-font);font-size:16px;cursor:pointer;
  }
  #cardClose:hover{background:#7A5634;color:#FFF}

  #cardBody{
    flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
    padding:28px 30px 24px 34px;
    background:var(--paper);
    scrollbar-color:#8A6540 #E7D9BC;
    scrollbar-width:thin;
  }
  #cardBody::-webkit-scrollbar{width:14px}
  #cardBody::-webkit-scrollbar-track{background:#E7D9BC;border-left:2px solid #C9B79A}
  #cardBody::-webkit-scrollbar-thumb{background:#8A6540;border:2px solid #6B4A2E}
  #cardBody::-webkit-scrollbar-thumb:hover{background:#A47A4C}
  #cardText{font-size:17px;line-height:34px;letter-spacing:1px;color:var(--ink)}
  #cardText p{text-indent:2em;margin-bottom:18px;user-select:text}
  #cardText p:last-child{margin-bottom:0}
  #cardEnd{
    margin-top:26px;padding-top:16px;border-top:2px dashed #C9B79A;
    font-size:12px;letter-spacing:3px;color:#A89070;text-align:center;
  }

  #cardFoot{
    flex:0 0 52px;background:#EADFC5;border-top:4px solid #C9B79A;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;font-size:12px;letter-spacing:2px;color:#8A5C35;
  }
  #scrollHint{display:flex;align-items:center;gap:10px}
  #arrow{
    display:inline-block;font-family:var(--en-font);color:var(--seal);
    animation:bob 1.1s steps(2,end) infinite;
  }
  @keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(5px)}}
  #scrollHint.done{color:#8A5C35}
  #scrollHint.done #arrow{display:none}
  #cardCount{color:#A83A2C}

  /* ---------- 全亮 ---------- */
  #finish{
    position:absolute;left:432px;top:752px;width:576px;height:64px;z-index:10;
    background:var(--wood);border:8px solid var(--wood-edge);
    box-shadow:8px 8px 0 rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;letter-spacing:2px;color:#4A3220;cursor:pointer;
    visibility:hidden;opacity:1;transform:translateY(14px);pointer-events:none;
    transition:transform 800ms ease;
  }
  #finish.show{
    visibility:visible;transform:translateY(0);pointer-events:auto;
    animation:finishFade 700ms ease-out;
  }
  @keyframes finishFade{from{opacity:0}to{opacity:1}}
  #finish:hover{background:#F0D19C}
</style>
</head>
<body>

<div id="stage">
  <div id="topbar"></div>

  <!-- 俯视像素校园：与画布「02 · 高中记忆地图」设计稿一致 -->

      <rect x="404" y="700" width="16" height="8"/><rect x="620" y="790" width="24" height="8"/>
      <rect x="1136" y="700" width="16" height="8"/><rect x="1204" y="792" width="24" height="8"/>
      <rect x="700" y="256" width="16" height="8"/><rect x="880" y="300" width="24" height="8"/>

    <!-- 星点微光 -->
    <g fill="#9FB3D4" fill-opacity=".35">
      <rect x="80" y="60" width="4" height="4"/><rect x="352" y="52" width="4" height="4"/>

  <div id="dawn"></div>

  <div id="hud">

      <div id="panelTitle">已点亮 0 / 7</div>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  /* ================= 七处记忆：原文一字未删 ================= */
  var MEMORIES = [
    {
      no:'01', name:'一饭路上', place:'一饭楼南侧 · 通往炸鸡档的小路', x:248, y:250,
      text:`高一上和你的交际似乎不算特别之多，但是因为少，所以记得清晰。第一次让我惊讶是你好像我爸一样的社牛自来熟地在楼梯上和我和叶子打招呼，那声招呼对于只为同学的我们也实在是热情过了头"早上好文哲，""早上好，子瑜"，这声文哲让当时的我只是一时的惊讶，却没想到之后的我记那么久，直至现在我听到文哲，还是第一个，唯一一个想起你。因为我爸给我的耳濡目染，所以我感觉的不只惊讶，而是热情，之后我好像还特地问过你为什么如此热情，清晰的答案我已经忘记了，但是仍然记得你大概说的是只是单纯的热情，哈哈幸好我没有理解错哈哈。所以在一次下到一楼通往一饭的炸鸡档的路上，我碰上了迎面走来的你，我的脑子似乎还没有动，我的嘴巴就不加思索的"中午好，林钲"，当然我也收获了一声好听的"中午好，文哲"。感觉就是在你的一次次打招呼后，我背过去一直笑的积累下，才会落下我之后一听你说话就想要抿嘴偷笑的毛病。`
    },
    {
      no:'02', name:'楼梯口', place:'高一楼西端 · 上楼处', x:348, y:326,
      text:`高中的进度总是推着我们不停地走，其实好像也没有好忙，但是淡淡的焦虑细细的迷茫，举目四周没有准头没有尽头的失焦生活，束缚了许多情感的进一步试探深入，但是也放大了在平淡生活中即使模糊微弱但难得可贵的小小瞬间的感动与深刻，就像一饭后面的暗暗的林荫大树的叶隙中的光一样，一点点就好，一点点就那么耀眼。有一天好像又是吃完饭哈哈，真是怎么又是吃完饭，其实似乎一切的deeptalk都是饭后的小憩，天马行空指点江山激扬文字的畅谈幻想，好难说不是淀粉的晕碳了。那天你问我会选什么科，我当时没有什么犹豫就回答了物化生，你好像还有一点迟疑，在地理和生物里摇摆着。我记得当时你的地理小测成绩特别好，所以我毫不掩饰的夸奖你的地理能力，激励你好好想想。当时的我还没有对deeptalk的概念，也没有像现在一样意识到自己对deeptalk的极大需求，但是那一天，那一个短短的只有不足十分钟的上楼，是我们不过第三次的对话，还属于萍水相逢的我们竟不约而同地开始了我们的第一次deeptalk。`
    },
    {
      no:'03', name:'实验楼 · 傍晚', place:'实验楼与高一楼之间的走廊', x:338, y:566,
      text:`虽然我没有轰轰烈烈的行动，但是在悄悄摸摸地忙碌学习之余，偷偷在人群中靠近你的事我没有少做。已经忘记了是什么契机，或许是期中考的焦虑波及，我有了找一处清净背诵生物的计划，那，实验楼走廊当然是一个好选择。下午下课，急急吃上几口饭，抄起生物书，一支铅笔，就是背。那时候背生物是真的爽啊，一本书，用自己的逻辑串起一问一答或步步推进的一段话，感觉知识或许艰难或许顺滑地流入大脑化入皮层，再在最后自信满满地复述出来，这样的舒畅让我们一帮朋友都以读生物作为志向，虽然现在都几乎是码农哈哈。又跑题了哈哈，那次绝对无意的背书，大概就是我初次心动的起点。上完午课，吃过晚饭的时光是高中最放松的时刻，大概是看着楼下的羽毛球声，欢笑打闹声，随心所欲地闲聊无事地背背一些或许有用于高考无用但喜欢的内容是很放松的时刻。我就是这样走到了实验楼的走廊，肆意地背诵着自己喜欢的生物。沉浸读书，夜幕忽至，阴影从一点点到铺满整本书页，但是还远远没到回教室的时刻。我用余光看见你自然地把你那边的灯打开，害怕被发现偷看你的一丝余光，我没有马上去开灯，假装认真入迷地盯着书本。忽然我身后的灯亮了，我们的交集也亮了，我的心也亮了。`
    },
    {
      no:'04', name:'百叶窗后的光', place:'高一楼横廊 · 洗手池前的百叶窗', x:536, y:316,
      text:`高中我本来是打算拍好多好多照片，但是或许是因为我的相机一开始不是CCD一个小小的薄片，而是一个厚厚的相机，甚至镜头还不可以完全收缩到机体里，我一直懊悔没有早早给我的那个小小的可以藏进袖口的CCD装上电池，否则我、我们就会拥有好多视频，我会嗖地从我的宽宽的校服口袋里面掏掏出它，攥在手里，不显眼，不破坏那个恰到好处的时刻，甚至不用对焦，不用防震，记忆会存在我们的眼睛里，也会存在我们的硬件里。然而并没有这么多视频，甚至没有多少照片。第一张给你拍的照片就是我整个高中生涯拍的最具挑战性的照片了哈哈，是我私心的一张偷拍，是我们甚至还没有认识的时候拍的。那是我最后悔没有给我的相机装上长焦镜头的一天，这导致之后的几乎每一周我都带上了长焦镜头回学校。给你拍下那张穿过窗口在远远的穿过连廊的对面楼的楼道里面，在朦胧的一点黄色灯光下面读书的照片的那天之前，其实我已经"踩过好几天的点"了。但是真正去拍的那天也不是天时地利人和有多么好，我几天的踩点没有发现一个好机位。但是那天我刚好在女厕所的洗手池洗完手，一抬头，我从洗手台前面的百叶窗的缝隙里发现了一点黄光，就是你读书的那一点黄光，我没有犹豫跑回课室拿上我有点明显的厚厚的相机再跑回来，从小小的窗缝探出去，我的镜头的长度是那么可笑哈哈，拉到最近最近你也只有手指的一节那么大，甚至我都不敢拍第二张，连对焦都来不及，我就落荒而逃了。如果回到那一天，我一定大胆的多拍几张，那张对焦对到了窗框上的照片，特别遗憾。`
    },
    {
      no:'05', name:'二饭', place:'二饭楼前 · 马路南侧', x:1040, y:226,
      text:`hh每写一段就要停好久，感谢你一直找我说话，每次想起你我就想要写一段，每次听到你给我说谢谢，我都要说我们是什么关系还要说谢谢，但是在提起你的时候我无数次的说谢谢，是呀，谢谢不是在我们这里永远不是客套的生疏，是真的真的感谢我们曾经勇敢过一次。有一次，你说对陌生人都要感谢，对亲近的人更加不可以认为得到的帮助是理所应当的，哈哈真的好可爱，但是其实我愿意永远帮助你，祝我们都可以成为更好的人。有时候总会想起我们傻傻的时候，就像我当时有段时间说我超喜欢吃辣，喜欢吃食堂的那个水煮肉片，有时我就会想难道这就是我大学来到了重庆的命运安排吗，结果有一天你和我说你坚持吃了一个月的水煮肉片，我当时真的震惊大大震惊，这不上火成啥样了，结果你一脸认真地说你是为了练你的吃辣能力。还有我错过的麦旋风，我已经有点模糊我什么时候说过我爱吃了，或许是我提起我某次和我爸去散步吃了麦旋风。`
    },
    {
      no:'06', name:'那条大路', place:'校门外 · 赵忠与家之间的大路', x:752, y:206,
      text:`还记得最疯狂的那次是我有一个周五还是周六的晚上，溜进初中部的楼里，我们就是静静地站在赵忠和我家之间的那条大路，那条大路分明晚上甚至白天都没有特别多的车，或许是有点昏黄模糊重叠的灯光的影响，你说希望我们都能一直走到这样灯火通明璀璨的城市里，我们静静看着，较着劲地和自己的梦想校准着，你眼眸里倒影的光我一直记着。我真的和无数人说过我认为你的人生应该就应该是一直顺利地走到这样的灯光里的，你的语文积累，你的物理笔记，你的探索，你的用力，你的一切是那么地值得更好啊。无论你的愿望有没有改变，都祝你最后可以走到自己心里的那片光里。`
    },
    {
      no:'07', name:'实验楼 · 清晨', place:'高一楼对面横廊 · 侧边尽头', x:712, y:604,
      text:`我们的读书地点在我的课室的对面，我只要穿过一个短短的横廊，后来我们改到了我的课室的对面的横廊的侧边的尽头。就是这么一点点的加长的距离，让我现在回想起来有很大的差别。我还可以记起那一天天的早晨，我从晨雾蒙蒙的校道窜到被捂得闷闷的食堂里买一个腻腻的干蒸，然后冲回教室，抄上我的英语书，再穿过一样晨雾蒙蒙的横廊，走到走廊上，我会佯装放慢脚步，而小小的你就在走廊的尽头等着我。`
    }
  ];

  /* ================= 地图生成 ================= */
  // 北侧：一饭 / 宿舍 / 二饭；中段：实验楼 / 高一楼 / 高二楼；东侧：高三楼 / 市场
  var BUILDINGS = [
    {x:96,  y:20,  w:208, h:72, cols:5, label:'一饭'},
    {x:472, y:20,  w:288, h:72, cols:7, label:'宿舍'},
    {x:984, y:20,  w:208, h:72, cols:5, label:'二饭'},
    {x:140, y:410, w:190, h:150, cols:4, rows:3},
    {x:360, y:400, w:340, h:100, cols:8, rows:2},
    {x:360, y:548, w:340, h:100, cols:8, rows:2},
    {x:1060,y:520, w:220, h:140, cols:5, rows:3},
    {x:1300,y:500, w:110, h:100, cols:2, rows:2}
  ];
  var bg = document.getElementById('buildings');
  BUILDINGS.forEach(function(b, bi){
    bg.appendChild(svg('rect',{x:b.x-4,y:b.y-4,width:b.w+8,height:b.h+8,fill:'#241A12'}));
    bg.appendChild(svg('rect',{x:b.x,y:b.y,width:b.w,height:b.h,fill:'#6B4230'}));
    bg.appendChild(svg('rect',{x:b.x-4,y:b.y-4,width:b.w+8,height:10,fill:'#C9D6E6'}));
    bg.appendChild(svg('rect',{x:b.x,y:b.y+10,width:b.w,height:4,fill:'#8C6247'}));
    var cols = b.cols, rows = b.rows || 1;
    var gap = b.w / cols;
    for (var r = 0; r < rows; r++){
      for (var c = 0; c < cols; c++){
        var wx = b.x + Math.round(gap * c + gap / 2 - 8);
        var wy = b.y + 26 + r * Math.round((b.h - 36) / rows);
        var cls = 'win' + ((c + r * 3 + bi) % 7 === 0 ? ' pre' : '');
        bg.appendChild(svg('rect',{x:wx,y:wy,width:16,height:16,'class':cls}));
      }
    }
  });

  var TREES = [
    [60,236],[60,332],[60,428],[60,620],[60,716],
    [180,300],[180,660],[180,780],
    [760,300],[840,380],[900,470],[940,560],
    [1140,300],[1200,400],[1260,680],[1340,300],
    [420,690],[500,820],[680,720],[1100,760]
  ];
  var tg = document.getElementById('trees');
  TREES.forEach(function(t, i){
    var g = svg('g',{transform:'translate('+t[0]+','+t[1]+')'});
    g.appendChild(svg('rect',{x:12,y:20,width:8,height:14,fill:'#3A2A1C'}));
    g.appendChild(svg('rect',{x:8,y:4,width:16,height:20,fill:'#1C3B31'}));
    g.appendChild(svg('rect',{x:4,y:10,width:24,height:14,fill:'#234A3C'}));
    g.appendChild(svg('rect',{x:10,y:0,width:12,height:6,fill:'#2C5A48'}));
    if (i % 4 === 0) g.appendChild(svg('rect',{x:10,y:0,width:12,height:4,fill:'#D8E4F3','fill-opacity':'.55'}));
    tg.appendChild(g);
  });

  var dash = document.getElementById('roadDash');
  for (var dx = 0; dx < 1440; dx += 48){
    dash.appendChild(svg('rect',{x:dx,y:150,width:24,height:4}));
  }

  /* ================= 七盏路灯 ================= */
  var lampLayer = document.getElementById('lampLayer');
  var spots = [];
  MEMORIES.forEach(function(m, i){
    var el = document.createElement('div');
    el.className = 'spot';
    el.style.left = m.x + 'px';
    el.style.top  = m.y + 'px';
    el.innerHTML =
      '<div class="halo"></div><div class="pool"></div>' +
      '<svg viewBox="0 0 40 64" shape-rendering="crispEdges">' +
        '<rect x="12" y="60" width="16" height="4" fill="#12192A"/>' +
        '<rect x="18" y="22" width="4" height="38" fill="#1A2233"/>' +
        '<rect x="8"  y="6"  width="24" height="4" fill="#12192A"/>' +
        '<rect x="10" y="10" width="20" height="4" fill="#20293C"/>' +
        '<rect class="bulb" x="12" y="14" width="16" height="10"/>' +
        '<rect x="10" y="24" width="20" height="4" fill="#12192A"/>' +
      '</svg>' +
      '<div class="lbl"><b>'+m.no+'</b>'+m.name+'</div>' +
      '<div class="hit" title="点开这一处的记忆"></div>';
    lampLayer.appendChild(el);
    el.addEventListener('click', function(e){ e.stopPropagation(); openCard(i); });
    spots.push(el);
  });

  /* ================= 状态 ================= */
  var lit  = MEMORIES.map(function(){ return false; });
  var read = MEMORIES.map(function(){ return false; });
  var current = -1;
  /* 定案（2026-11-07）：点开卡片即点亮该处路灯；长卡片连续滚动。
     「读到底」只标记读完的仪式感，不影响点亮；8px 网格仅作像素视觉语言，不量化滚动。 */
  var veil   = document.getElementById('veil');
  var card   = document.getElementById('card');
  var body   = document.getElementById('cardBody');
  var textEl = document.getElementById('cardText');
  var hint   = document.getElementById('scrollHint');
  var hintTx = document.getElementById('hintText');
  var finish = document.getElementById('finish');
  var dotsWrap = document.getElementById('dots');
  var dots = [];
  for (var d = 0; d < 7; d++){
    var dot = document.createElement('div');
    dot.className = 'dot';
    dotsWrap.appendChild(dot);
    dots.push(dot);
  }

  function litCount(){ return lit.filter(Boolean).length; }

  function refreshHUD(){
    var n = litCount();
    document.getElementById('panelTitle').textContent =
      (n === 7 ? '七盏灯都亮了' : '已点亮 ' + n + ' / 7');
    document.getElementById('cardCount').textContent = '已点亮 ' + n + ' / 7';
    dots.forEach(function(dot, i){
      dot.classList.toggle('lit', lit[i]);
      dot.classList.toggle('read', read[i]);
    });
    try { localStorage.setItem('winter-letter:lit', JSON.stringify(lit)); } catch(e){}
  }

  function lightUp(i){
    if (lit[i]) return;
    lit[i] = true;
    spots[i].classList.add('lit','justLit');
    setTimeout(function(){ spots[i].classList.remove('justLit'); }, 950);
    refreshHUD();
    if (lit.every(Boolean)) celebrate();
  }

  function celebrate(){
    document.getElementById('map').classList.add('allLit');
    document.getElementById('dawn').classList.add('show');
    document.getElementById('tips').classList.add('hide');
    lampLayer.classList.add('celebrate');
    setTimeout(function(){
      finish.classList.add('show');
      lampLayer.classList.remove('celebrate');
    }, 900);
  }

  /* 原文按句读分段，只插入段落标签，不增删任何字符 */
  function buildParagraphs(text){
    var sentences = [], buf = '';
    for (var i = 0; i < text.length; i++){
      buf += text[i];
      if ('。！？'.indexOf(text[i]) >= 0){ sentences.push(buf); buf = ''; }
    }
    if (buf) sentences.push(buf);
    textEl.textContent = '';
    for (var s = 0; s < sentences.length; s += 3){
      var p = document.createElement('p');
      p.textContent = sentences.slice(s, s + 3).join('');
      textEl.appendChild(p);
    }
  }

  function openCard(i){
    current = i;
    var m = MEMORIES[i];
    document.getElementById('cardNo').textContent = m.no;
    document.getElementById('cardTitle').textContent = m.name;
    document.getElementById('cardPlace').textContent = m.place;

    // 卡片停在被点路灯的对侧，保证「这一盏点亮」一定看得见
    card.style.left = (m.x < 720 ? 792 : 48) + 'px';

    buildParagraphs(m.text);
    body.scrollTop = 0;
    card.classList.add('show');
    veil.classList.add('show');
    hint.classList.remove('done');
    hintTx.textContent = '上下滑动 · 读完这一盏';

    lightUp(i);   // 点开即亮（定案）
    checkBottom();
    refreshHUD();
  }

  function closeCard(){
    card.classList.remove('show');
    veil.classList.remove('show');
    current = -1;
  }

  function checkBottom(){
    if (current < 0) return;
    var atEnd = body.scrollTop + body.clientHeight >= body.scrollHeight - 8;
    if (!atEnd) return;
    if (!read[current]){
      read[current] = true;
      refreshHUD();
    }
    hint.classList.add('done');
    hintTx.textContent = '✦ 这一盏，读完了';
  }

  body.addEventListener('scroll', checkBottom);
  /* 滚轮交给浏览器原生连续滚动；8px 网格只保留在像素滚动条等视觉层 */

  veil.addEventListener('click', closeCard);
  document.getElementById('cardClose').addEventListener('click', function(e){
    e.stopPropagation(); closeCard();
  });

  /* ================= 键盘 ================= */
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeCard(); return; }
    if (e.key >= '1' && e.key <= '7'){ openCard(parseInt(e.key, 10) - 1); return; }
    if (current < 0){
      if (e.key === 'Enter' && finish.classList.contains('show')) goNext();
      return;
    }
    var step = 48;
    if (e.key === 'ArrowDown' || e.key === ' '){ e.preventDefault(); body.scrollTop += step; checkBottom(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); body.scrollTop -= step; }
    else if (e.key === 'PageDown'){ e.preventDefault(); body.scrollTop += body.clientHeight - 40; checkBottom(); }
    else if (e.key === 'PageUp'){ e.preventDefault(); body.scrollTop -= body.clientHeight - 40; }
    else if (e.key === 'End'){ e.preventDefault(); body.scrollTop = body.scrollHeight; checkBottom(); }
    else if (e.key === 'Home'){ e.preventDefault(); body.scrollTop = 0; }
  });

  /* ================= 控件 ================= */
  document.getElementById('back').addEventListener('click', function(e){
    e.stopPropagation(); window.location.href = '01-opening-letter.html';
  });
  function goNext(){ window.location.href = '07-the-last-lamp.html'; }
  finish.addEventListener('click', function(e){ e.stopPropagation(); goNext(); });

  document.getElementById('replay').addEventListener('click', function(e){
    e.stopPropagation();
    lit  = MEMORIES.map(function(){ return false; });
    read = MEMORIES.map(function(){ return false; });
    spots.forEach(function(s){ s.classList.remove('lit','justLit'); });
    document.getElementById('map').classList.remove('allLit');
    document.getElementById('dawn').classList.remove('show');
    document.getElementById('tips').classList.remove('hide');
    lampLayer.classList.remove('celebrate');
    finish.classList.remove('show');
    closeCard();
    refreshHUD();
  });

  /* ================= 等比缩放 ================= */
  var stage = document.getElementById('stage');
  function fit(){
    var s = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  refreshHUD();

  /* 便于试手感的直达入口：?open=4 直接打开第 4 处，?all=1 直接看全亮结尾 */
  var qs = new URLSearchParams(location.search);
  var openIdx = parseInt(qs.get('open'), 10);
  if (qs.get('all') === '1'){
    lit.forEach(function(_, i){ lightUp(i); });
  } else if (openIdx >= 1 && openIdx <= 7){
    openCard(openIdx - 1);
  }
})();
</script>
</body>
</html>
